spring.application.name=gaply-backend

# Server
server.port=8080

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Frontend origin (Next.js dev server)
gaply.cors.allowed-origins=http://localhost:3000

# arXiv API (Atom feed — no API key required, generous rate limits)
gaply.arxiv.base-url=https://export.arxiv.org
# Note: hard-capped at 10 in ArxivService.MAX_SEARCH_LIMIT regardless of this value.
gaply.arxiv.search-limit=10

# Caching — cuts repeat hits to arXiv during demos / dev
spring.cache.type=caffeine
spring.cache.cache-names=arxivSearch,arxivPaper
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# Groq API — OpenAI-compatible Chat Completions, free tier with generous limits.
# Get a key at https://console.groq.com/keys and export GROQ_API_KEY.
gaply.groq.api-key=${GROQ_API_KEY:}
gaply.groq.base-url=https://api.groq.com/openai/v1
gaply.groq.model=llama-3.3-70b-versatile
gaply.groq.temperature=0.4
# When true, AI features return realistic mock responses on any Groq failure
# (missing key, rate limited, network errors). Set to false in development if
# you want errors to surface instead of falling back.
gaply.groq.fallback-enabled=true

# Logging
logging.level.com.gaply.backend=INFO
